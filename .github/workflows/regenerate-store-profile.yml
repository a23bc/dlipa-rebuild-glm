# Regenerates the Store profile that the emulator needs, from the pinned image.
#
# Two jobs in one workflow because the first output is the second input and both
# are regenerated together:
#
#   1. dump the dyld shared cache and the FeatureFlags plists out of the pinned
#      restore image -- nothing wrote them to disk before
#   2. run profilegen over that dump to produce data_generated.go
#
# No actions/cache. A full run takes about two minutes, because ipatool reads the
# image with HTTP range requests and streams the extraction; caching 6.6 GB to
# save two minutes spent two thirds of the repository's cache quota.
name: Regenerate Store profile

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IPATOOL_REPO: https://github.com/majd/ipatool
  IPATOOL_REF: 5dc4c8058db3a23e9de081ac766cc917713a65cf
  CACHE_PREFIX: dyld_shared_cache_arm64e

jobs:
  profile:
    # Extraction needs neither macOS nor iOS; it needs disk and bandwidth.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Check out the pinned ipatool and install the exporters
        run: |
          git init -q /tmp/ipatool
          cd /tmp/ipatool
          git remote add origin "$IPATOOL_REPO"
          git fetch -q --depth 1 origin "$IPATOOL_REF"
          git checkout -q FETCH_HEAD
          cd - >/dev/null

          # The pin must carry the remote extraction set; both exporters use it.
          for required in remote.go aea.go apfs.go dyld.go store.go; do
            if [ ! -f "/tmp/ipatool/internal/sap/assets/$required" ]; then
              echo "::error::pinned ipatool commit has no internal/sap/assets/$required"
              exit 1
            fi
          done
          if [ ! -d /tmp/ipatool/internal/store/profilegen ]; then
            echo "::error::pinned ipatool commit has no internal/store/profilegen"
            exit 1
          fi

          cp scripts/export-dyld-cache/assets_export.go \
             /tmp/ipatool/internal/sap/assets/export_dyld_cache.go
          mkdir -p /tmp/ipatool/cmd/export-dyld-cache
          cp scripts/export-dyld-cache/main.go \
             /tmp/ipatool/cmd/export-dyld-cache/main.go
          mkdir -p /tmp/ipatool/cmd/export-profile
          cp scripts/export-profile/main.go \
             /tmp/ipatool/cmd/export-profile/main.go
          mkdir -p /tmp/ipatool/cmd/export-cache-pages
          cp scripts/export-cache-pages/main.go \
             /tmp/ipatool/cmd/export-cache-pages/main.go

      - name: Dump the cache and the feature flags
        run: |
          mkdir -p "$RUNNER_TEMP/dyld"
          cd /tmp/ipatool
          go run ./cmd/export-dyld-cache \
            -prefix "$RUNNER_TEMP/dyld/$CACHE_PREFIX" \
            -system-dir "$RUNNER_TEMP/dyld-system"
          cd - >/dev/null

      - name: Check the dump
        run: |
          dir="$RUNNER_TEMP/dyld"
          sys="$RUNNER_TEMP/dyld-system"

          echo "==> shared cache"
          ls -la "$dir" | head -20
          count=$(find "$dir" -type f | wc -l | tr -d ' ')
          bytes=$(du -sb "$dir" | cut -f1)
          echo "members: $count, total: $bytes bytes"

          # The main member is a header and index, not the payload: 736 KB while
          # the subcaches hold gigabytes. So the test is on the set, not on it.
          main="$dir/$CACHE_PREFIX"
          if [ ! -f "$main" ]; then
            echo "::error::$main is missing"
            exit 1
          fi
          size=$(stat -c %s "$main")
          echo "main member (header): $size bytes"
          if [ "$size" -lt 4096 ]; then
            echo "::error::$main is $size bytes; too small to be a header"
            exit 1
          fi
          if [ "$count" -lt 10 ]; then
            echo "::error::only $count member(s); the header walk should list dozens"
            exit 1
          fi
          if [ "$bytes" -lt 1000000000 ]; then
            echo "::error::the set is $bytes bytes, under 1 GB"
            exit 1
          fi

          echo "==> feature flags"
          ls -la "$sys"
          for domain in AppleMediaServices CFNetwork Foundation; do
            if [ ! -s "$sys/$domain.plist" ]; then
              echo "::error::$sys/$domain.plist is missing or empty"
              exit 1
            fi
          done

      - name: Generate the profile
        run: |
          cd /tmp/ipatool
          go run ./cmd/export-profile \
            -prefix "$RUNNER_TEMP/dyld/$CACHE_PREFIX" \
            -system-dir "$RUNNER_TEMP/dyld-system" \
            -output "$RUNNER_TEMP/data_generated.go"
          cd - >/dev/null

      - name: Check the profile
        run: |
          file="$RUNNER_TEMP/data_generated.go"
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty"
            exit 1
          fi

          size=$(stat -c %s "$file")
          lines=$(wc -l < "$file")
          echo "profile: $size bytes, $lines lines"

          # Shape checks only: non-empty, plausible size, right header. Naming
          # the tables inside the generated source was a guess about its form
          # and guessed wrong, so the real comparison is the hash below.
          if [ "$size" -lt 100000 ]; then
            echo "::error::$file is $size bytes; a real profile is megabytes"
            exit 1
          fi
          if ! head -1 "$file" | grep -q "Code generated"; then
            echo "::error::$file does not start with the generated-code header"
            exit 1
          fi

          # The meaningful check: does regenerating from our pinned image give
          # the profile upstream committed? Identical means our dump, our
          # feature-flag source and our runner are all faithful. A difference
          # is not a failure -- it is the diff to review before adopting it.
          upstream=/tmp/ipatool/internal/store/profile/data_generated.go
          ours=$(sha256sum "$file" | cut -d" " -f1)
          theirs=$(sha256sum "$upstream" | cut -d" " -f1)
          echo "ours:     $ours"
          echo "upstream: $theirs"
          if [ "$ours" = "$theirs" ]; then
            echo "::notice::the regenerated profile is byte-identical to the committed one"
          else
            echo "::warning::the regenerated profile differs from the committed one"
            diff <(head -c 200000 "$file") <(head -c 200000 "$upstream") | head -40 || true
          fi
      - name: List the pages the profile points at
        run: |
          cp "$RUNNER_TEMP/data_generated.go" \
             sapbridge/internal/store/profile/data_generated.go
          cd sapbridge
          go run ./cmd/export-cache-pages \
            -addresses "$RUNNER_TEMP/addresses.txt"
          wc -l "$RUNNER_TEMP/addresses.txt"

      - name: Pull those pages out of the dumped cache
        run: |
          mkdir -p sapbridge/internal/store/cachepages
          cd /tmp/ipatool
          go run ./cmd/export-cache-pages \
            -prefix "$RUNNER_TEMP/dyld/$CACHE_PREFIX" \
            -system-dir "$RUNNER_TEMP/dyld-system" \
            -addresses "$RUNNER_TEMP/addresses.txt" \
            -output "$GITHUB_WORKSPACE/sapbridge/internal/store/cachepages/pages.bin.zst"
          ls -l "$GITHUB_WORKSPACE/sapbridge/internal/store/cachepages/pages.bin.zst"


      - uses: actions/upload-artifact@v4
        with:
          name: store-profile
          path: ${{ runner.temp }}/data_generated.go

      - name: Upload the page blob
        uses: actions/upload-artifact@v4
        with:
          name: cache-pages
          path: sapbridge/internal/store/cachepages/pages.bin.zst
          if-no-files-found: error
          retention-days: 30
