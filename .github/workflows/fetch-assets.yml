name: Fetch SAP assets

# Produces the seven Apple SAP binaries for the arm64 route (plan B).
#
# Source of truth is Apple, not a checked-in copy: the pinned macOS 27.0.1
# (26A434) restore image, read over HTTP in ranges, AEA-decrypted, APFS-walked
# and pulled out of the dyld shared cache. That work is implemented here, in
# internal/sap/assetsremote, and this job runs exactly the code a device runs:
# `go run ./cmd/exportassets`.
#
# It used to run upstream ipatool's extractor instead, by copying
# scripts/export-sap-assets.go into a pinned ipatool checkout and aligning
# that checkout's go-macho with ours. That produced a four-file profile,
# because that is all upstream's loader knows: the three identity binaries the
# seven-piece profile needs came out of nothing, and the four that did get
# written were verified against digests this repository also pins. One job,
# two profiles -- which is how a green upload becomes "adid is empty or
# missing" at the first reader that trusts the artifact.
#
# The device does not use this artifact today: builds ship without the
# binaries and the bridge resolves them on first use (see AssetStaging's
# resolvesOnDemand). This job is the offline fallback for that route, so the
# extraction it performs has to be the same one, byte for byte.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the assets to a release tag (name it below)"
        required: false
        default: ""

# Read-only: this workflow uploads an artifact and nothing else. The
# publish_release input has no step behind it, so write access was never used.
permissions:
  contents: read

jobs:
  fetch:
    # The extraction needs neither macOS nor iOS; it needs disk and bandwidth.
    # The image set is ~14 GB compressed and the profile is ~300 MB of range
    # reads out of it, so this is a long job on purpose.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: sapbridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The module's own pin, rather than a version written down here too:
          # a CI-only Go that disagrees with the one the device build uses is
          # how an artifact gets produced by code nothing ships.
          go-version-file: sapbridge/go.mod

      - name: Compile the exporter before spending the bandwidth
        run: go build ./cmd/exportassets

      - name: Fetch and extract the macOS 27 assets
        run: go run ./cmd/exportassets -out "$GITHUB_WORKSPACE/VendorAssets"

      - name: Verify against the pinned digests
        run: |
          cd "$GITHUB_WORKSPACE/VendorAssets"
          # The same seven values
          # sapbridge/internal/sap/assetsremote/assets.go checks at load time,
          # and Load() has already enforced them -- this list exists so a run
          # says out loud which build it produced, and so a drift in the pins
          # fails here rather than at the first device that downloads.
          check() {
            got=$(sha256sum "$1" | cut -d" " -f1)
            if [ "$got" != "$2" ]; then
              echo "::error::$1 digest mismatch: expected $2, got $got"
              exit 1
            fi
            echo "  ok $1 $got"
          }
          check AppleMediaServices 95f4558aa2c0ccd9f96ed479e336b630b46bf4b4e0baabc1c1ac8c7d55e21ab4
          check commerce           76de40a4a32f691947cb926ce3b128d2fc446f7cac9755f831c406cf5a316ac9
          check adid               1fec225b6917206e3d9b00fe636c04878f82bfd06a87a4b6941711de60efab5b
          check fairplayd          28b4c7b2a5a0409c5020da55fc3984713a8e2b0eec8557076c8717f7166d003e
          check FairPlayIOKit      47452960ec010d3a80b02cceec73a65f8a9758850fd0fb7b2fdac7a5d1b81025
          check CoreFP             2c30fa2b5f695fd66c0360dce72f54757d03ddb7107549715c12cb359a003b46
          check CoreFP.icxs        cb8f55330ec567da3e692dab5f5388bed0312dd9093340477c5759078cc2aa7b

          # Seven names is the profile. A count that drifts from the list above
          # means the artifact and the loader are no longer describing the same
          # thing, and no digest check below catches a file nobody asked for.
          count=$(ls -1 | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "::error::expected 7 staged files, found $count"
            exit 1
          fi

      - name: Record digests
        run: |
          cd VendorAssets
          sha256sum ./* | tee ../asset-digests.txt

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: sap-assets-macos27
          path: |
            VendorAssets
            asset-digests.txt
          if-no-files-found: error
