name: Fetch SAP assets

# Produces the four Apple SAP binaries for the arm64 route (plan B).
#
# Source of truth is Apple, not a checked-in copy: the pinned macOS 27.0.1
# (26A434) restore image. Upstream ipatool already implements the hard part --
# zip-range reads over HTTP, AEA decryption, APFS, and dyld shared cache
# extraction -- inside internal/sap/assets, where Load() falls back to
# resolveRemoteImage() when its cache is empty. scripts/export-sap-assets.go
# just calls Load() and copies the four files back out.
#
# This replaces the old job, which fetched the OS X 10.9 set used by route A.
# Those two sets are not interchangeable: 10.9 CoreFP is 29,014,912 bytes and
# 27 CoreFP is 94,842,464, and only the 27 set has the arm64
# AppleMediaServices that kbsync needs.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the assets to a release tag (name it below)"
        required: false
        default: ""

# Read-only: this workflow uploads an artifact and nothing else. The
# publish_release input has no step behind it, so write access was never used.
permissions:
  contents: read

env:
  # Pinned so the extraction logic cannot drift under us.
  #
  # This must be a commit that carries internal/sap/assets/remote.go. The
  # v2.7.0 tag does not: its assets.go has Load() but no macOSRestoreURL, and
  # the whole remote extraction set (remote.go, aea.go, apfs.go, dyld.go,
  # http_range.go) is main-only. Pinning the tag made the job fail in its first
  # step with nothing but a detached-HEAD notice, because the grep that follows
  # found no macOSRestoreURL and exited 1.
  #
  # The sha is the main commit the extraction was verified against; the grep
  # below still guards against a stale pin.
  IPATOOL_REPO: https://github.com/majd/ipatool
  IPATOOL_REF: 5dc4c8058db3a23e9de081ac766cc917713a65cf

jobs:
  fetch:
    # The extraction needs neither macOS nor iOS; it needs disk and bandwidth.
    # The image set is ~14 GB compressed, so this is a long job on purpose.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Check out the pinned ipatool
        run: |
          # No --branch: IPATOOL_REF is a sha, and --branch only takes a ref
          # name. Fetch the single commit instead.
          git init -q /tmp/ipatool
          cd /tmp/ipatool
          git remote add origin "$IPATOOL_REPO"
          git fetch -q --depth 1 origin "$IPATOOL_REF"
          git checkout -q FETCH_HEAD
          cd - >/dev/null
          # The exporter imports internal/sap/assets, which Go only allows from
          # inside the same module, so it is copied in rather than run from here.
          mkdir -p /tmp/ipatool/cmd/export-sap-assets
          cp scripts/export-sap-assets.go /tmp/ipatool/cmd/export-sap-assets/main.go
          # Fail loudly and early if the pin drifted to a tree without the
          # remote extractor. The old failure was silent: grep exited 1 and the
          # log only showed a detached-HEAD notice.
          if ! grep -q "macOSRestoreURL" /tmp/ipatool/internal/sap/assets/assets.go; then
            echo "::error::pinned ipatool commit has no macOSRestoreURL in assets.go;"
            echo "::error::it predates the remote extractor (remote.go). Update IPATOOL_REF."
            exit 1
          fi
          if [ ! -f /tmp/ipatool/internal/sap/assets/remote.go ]; then
            echo "::error::pinned ipatool commit has no internal/sap/assets/remote.go"
            exit 1
          fi
          grep -n "macOSRestoreURL" /tmp/ipatool/internal/sap/assets/assets.go

      - name: Fetch and extract the macOS 27 assets
        run: |
          cd /tmp/ipatool
          go run ./cmd/export-sap-assets -out "$GITHUB_WORKSPACE/VendorAssets"
          ls -la "$GITHUB_WORKSPACE/VendorAssets"

      - name: Verify against the pinned digests
        run: |
          cd "$GITHUB_WORKSPACE/VendorAssets"
          # These are the same four values sapbridge/internal/sap/assets/assets.go
          # checks at load time. A mismatch here means the extraction picked up a
          # different build, and failing now is far cheaper than failing on device.
          check() {
            got=$(sha256sum "$1" | cut -d" " -f1)
            if [ "$got" != "$2" ]; then
              echo "::error::$1 digest mismatch: expected $2, got $got"
              exit 1
            fi
            echo "  ok $1 $got"
          }
          check AppleMediaServices 95f4558aa2c0ccd9f96ed479e336b630b46bf4b4e0baabc1c1ac8c7d55e21ab4
          check commerce           76de40a4a32f691947cb926ce3b128d2fc446f7cac9755f831c406cf5a316ac9
          check CoreFP             2c30fa2b5f695fd66c0360dce72f54757d03ddb7107549715c12cb359a003b46
          check CoreFP.icxs        cb8f55330ec567da3e692dab5f5388bed0312dd9093340477c5759078cc2aa7b

      - name: Record digests
        run: |
          cd VendorAssets
          sha256sum ./* | tee ../asset-digests.txt

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: sap-assets-macos27
          path: |
            VendorAssets
            asset-digests.txt
          if-no-files-found: error
