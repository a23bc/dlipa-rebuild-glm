name: Build iOS IPA

# Builds an UNSIGNED .app and packages it as an .ipa.
# No Apple Developer account is needed: the user signs the IPA on their own
# machine with AltStore / Sideloadly using their free Apple ID, exactly as the
# original DLiPA README instructs.

# Manual only. This build takes about ten minutes and used to fire on every
# push, including pushes that only touched documentation. Trigger it with
#   gh workflow run "Build iOS IPA"
# and, to build something other than the default branch,
#   gh workflow run "Build iOS IPA" --ref <branch-or-tag>
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        required: false
        default: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-bridge:
    name: Build SAP bridge for iOS
    runs-on: macos-15
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # The X64I container the app interprets. It needs Go and the pinned OS X
      # 10.9 CommerceKit, nothing from the Unicorn build, so it runs here and
      # overlaps with that build instead of blocking the app job later.
      #
      # CommerceKit is the SAP driver: it exports _cp2g1b9ro, _Mib5yocT,
      # _Fc3vhtJDvr and the other two entries, and it imports no CoreFP symbol
      # at all. CoreFP belongs to the macOS 27 stack; the 10.9 driver has no
      # use for it.
      # The 10.9 binaries are a pinned, checksum-verified download from Apple
      # (~31 MB of a 1.27 GB package). Nothing about them changes between
      # builds, so the cache key is the fetch script itself: edit it and the
      # cache misses.
      - name: Cache the OS X 10.9 SAP binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/osx109
          key: osx109-${{ hashFiles('scripts/fetch-osx109-assets.py') }}

      - name: Build the SAP guest image
        run: |
          # Only fetches on a cache miss; the script re-verifies every file
          # against its pinned SHA-256 either way.
          # Absolute path: this step runs with working-directory sapbridge, so
          # a relative scripts/ would resolve inside the Go module.
          if [ ! -s "$GITHUB_WORKSPACE/osx109/CommerceKit" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/fetch-osx109-assets.py" \
              --out "$GITHUB_WORKSPACE/osx109"
          else
            echo "==> osx109 restored from cache"
          fi
          ls -la "$GITHUB_WORKSPACE/osx109"
          go run ./cmd/x86image \
            -in "$GITHUB_WORKSPACE/osx109/CommerceKit" \
            -out "$GITHUB_WORKSPACE/commerce.x64i"
          ls -la "$GITHUB_WORKSPACE/commerce.x64i"
        working-directory: sapbridge

      - name: Install build tools
        run: |
          # unicorn is for the host, not the target: the live SAP tests run the
          # emulation on the runner itself, and library_unix.go expects an
          # installed libunicorn.2.dylib instead of downloading one. Without it
          # every live test skipped, which looked identical to passing.
          brew install ldid cmake pkg-config unicorn
          ls -la /opt/homebrew/lib/libunicorn* 2>/dev/null || echo "no libunicorn under /opt/homebrew/lib"

      # Everything that used to sit between here and the Unicorn build was
      # diagnostic work for the Go SAP path: staging the 119 MB of macOS 27
      # binaries out of git-lfs, dumping the dlopen import surface, counting
      # fixups for a rewriter that was never written, the Go unit tests, and
      # three live tests that start the macOS 27 stack and reach Apple.
      #
      # The signing path now runs OS X 10.9 CommerceKit under the interpreter
      # (see the app job), so none of that describes the code that ships. It
      # cost about two minutes per build and could only fail for reasons that
      # had nothing to do with the IPA.
      #
      # What still needs the Go side is KBSync, which is a separate FairPlay
      # path, so SapBridge.a is still built and linked.

      # TCI (interpreter) build of the 1rhino2 fork, guest arch aarch64.
      #
      # The guest arch is decided here, not in the script, and it has to match
      # whoever calls uc_open. Signing now goes through the Go bridge's arm64
      # machine (sapbridge/internal/sap/machine), which opens UC_ARCH_ARM64, so
      # the archive must be built for aarch64. It used to be x86 for the C
      # engine, and building one without the other is what produced
      # "unicorn error 2: Invalid/unsupported architecture" at sign-in.
      - name: Build Unicorn for iOS arm64 (TCI, guest aarch64)
        run: |
          UNICORN_ARCH=aarch64 sh scripts/build-unicorn-ios.sh

      - name: B0 smoke - does the TCI interpreter execute aarch64
        run: |
          # A separate host build, purely to execute the interpreter. It does
          # not feed the app: the iOS archive above is what ships, and it is
          # built for aarch64 in its own step. This one only answers whether the
          # fork handles aarch64 instructions at all.
          UNICORN_ARCH=aarch64 HOST_BUILD=1 OUT_DIR="${{ github.workspace }}/build/tci-aarch64" \
            sh scripts/build-unicorn-ios.sh
          cc -O1 -I "${{ github.workspace }}/build/tci-aarch64/include" scripts/tci-smoke.c \
            "${{ github.workspace }}/build/tci-aarch64/libunicorn.a" -lm -lpthread -lc++ \
            -o /tmp/tci-smoke
          /tmp/tci-smoke

          echo "==> staged headers"
          ls build/ios/include/unicorn/
          echo "==> interpreter marker"
          nm -g build/ios/libunicorn.a 2>/dev/null | grep -ci tci || echo "no tci symbol"

      # gomobile is a host (macOS) tool. It must NOT see the iOS CGO_LDFLAGS,
      # or the linker rejects the Unicorn archive as the wrong platform.
      - name: Install gomobile
        # gomobile is a host tool. It must NOT inherit GOOS=ios, or go install
        # cross-compiles it and drops it in $GOPATH/bin/ios_arm64/gomobile.
        # It must also not see the iOS CGO_LDFLAGS, or the linker rejects the
        # Unicorn archive as the wrong platform.
        working-directory: sapbridge
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # init builds gobind, which bind requires. It must run without
          # GOOS=ios so gobind is a host binary too.
          gomobile init
          echo "==> gomobile ready"

      - name: Bind the bridge into an iOS framework
        working-directory: sapbridge
        env:
          CGO_ENABLED: "1"
          GOOS: ios
          GOARCH: arm64
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          # Unicorn must be force-loaded into the framework and its symbols
          # exported so purego.Dlsym can find them at runtime.
          #
          # Recorded with go env -w rather than only the shell environment:
          # gomobile spawns its own go build, and a value that exists only in
          # the environment is easy to lose across that boundary.
          go env -w CGO_LDFLAGS="-Wl,-force_load,${{ github.workspace }}/build/ios/libunicorn.a -Wl,-export_dynamic"
          echo "==> CGO_LDFLAGS: $(go env CGO_LDFLAGS)"
          # Only the device slice. Simulator targets cannot link an arm64 iOS
          # archive, and gomobile builds every variant of the target.
          gomobile bind -target=ios/arm64 \
            -o ../app/DLiPARebuild/Frameworks/SapBridge.xcframework .
          echo "==> framework contents"
          ls -laR ../app/DLiPARebuild/Frameworks/ | head -40
      - name: Inspect the framework
        run: |
          # An xcframework nests the real binary under ios-arm64/.
          find app/DLiPARebuild/Frameworks/SapBridge.xcframework -type f | head -20
          FRAMEWORK=$(find app/DLiPARebuild/Frameworks/SapBridge.xcframework -name SapBridge -type f | head -n 1)
          echo "==> binary: $FRAMEWORK"
          ls -la "$FRAMEWORK"
          file "$FRAMEWORK"
          echo "==> does it contain any uc_ symbol?"
          nm -A "$FRAMEWORK" 2>/dev/null | grep -c uc_ || echo 0
          echo "==> does it contain purego?"
          nm -A "$FRAMEWORK" 2>/dev/null | grep -c purego || echo 0

      - name: Dump the generated bridge header
        run: |
          # gomobile decides the Swift signatures. Guessing them from the Go
          # source is what produced a build that failed on close() and on an
          # optional binding, so the header is printed and read instead.
          find app/DLiPARebuild/Frameworks -name "Sapbridge.objc.h" -print -exec cat {} \;
      - name: Verify the framework contains Unicorn
        run: |
          # A missing Unicorn backend only shows up as uc_open failing at
          # runtime, which is invisible until the app runs. Check here.
          FRAMEWORK=$(find app/DLiPARebuild/Frameworks/SapBridge.xcframework -name SapBridge -type f | head -n 1)
          if [ -z "$FRAMEWORK" ]; then echo "::error::SapBridge binary not found in the xcframework"; exit 1; fi
          if nm -A "$FRAMEWORK" 2>/dev/null | grep -q uc_open; then
            echo "==> Unicorn symbols present"
          else
            echo "::error::uc_open not found; Unicorn is not linked into the framework"
            exit 1
          fi
          echo "==> exported uc_ symbols:"
          nm -A "$FRAMEWORK" 2>/dev/null | grep -c " T uc_" || true

      - name: Pack the bridge for the app job
        id: pack
        run: |
          # Ship both archives the app link needs: the gomobile c-archive that
          # carries the Sapbridge* symbols, and libunicorn.a. Both are
          # force-loaded through OTHER_LDFLAGS in project.yml, so the app is a
          # single executable with no embedded framework.
          #
          # One tar root: bsdtar cannot mix -C roots.
          mkdir -p stage/ios
          cp build/ios/libunicorn.a stage/ios/
          # sap_guest.c is compiled by the app job, which runs on its own
          # runner and therefore has no Unicorn source tree. Ship the headers
          # with the archive or HEADER_SEARCH_PATHS points at nothing.
          if [ ! -f build/ios/include/unicorn/unicorn.h ]; then
            echo "::error::build/ios/include/unicorn/unicorn.h missing; build-unicorn-ios.sh did not stage the headers"
            exit 1
          fi
          cp -R build/ios/include stage/ios/include
          cp app/DLiPARebuild/Frameworks/SapBridge.xcframework/ios-arm64/SapBridge.framework/SapBridge stage/SapBridge.a
          # The generated header ships too, so the app job can check the
          # hand-written bridging header against it. That header is the only way
          # Swift learns this API, and a declaration missing from it costs a whole
          # build-and-install cycle to discover.
          cp app/DLiPARebuild/Frameworks/SapBridge.xcframework/ios-arm64/SapBridge.framework/Headers/Sapbridge.objc.h stage/Sapbridge.objc.h
          cp "$GITHUB_WORKSPACE/commerce.x64i" stage/commerce.x64i
          # commerce.x64i has to be in the archive list, not just copied into
          # the staging directory.
          tar -czf sapbridge-ios.tar.gz -C stage ios SapBridge.a Sapbridge.objc.h commerce.x64i
          echo "artifact=sapbridge-ios.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sapbridge-ios
          path: sapbridge-ios.tar.gz
          retention-days: 5

  app:
    name: Build unsigned DLiPA Rebuild app
    runs-on: macos-15
    needs: go-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Download the SAP bridge
        uses: actions/download-artifact@v4
        with:
          name: sapbridge-ios
          path: bridge

      - name: Unpack the bridge
        run: |
          # The archive goes straight into the link. No framework is
          # unpacked into the bundle: the gomobile archive is force-loaded
          # into the app binary, so the bundle stays a single executable
          # and MobileInstallation has no nested bundle to reject.
          mkdir -p app/build/ios
          tar -xzf bridge/sapbridge-ios.tar.gz -C bridge
          mv bridge/ios/libunicorn.a app/build/ios/
          # $(SRCROOT)/build/ios/include is the HEADER_SEARCH_PATHS entry in
          # project.yml; sap_guest.c does not compile without it.
          mv bridge/ios/include app/build/ios/include
          mv bridge/SapBridge.a app/build/ios/

          # The bridging header is maintained by hand; gomobile's output is the
          # authority. Compare the two and fail here rather than at compile time
          # several minutes later with "has no member", which says nothing about
          # why.
          python3 scripts/check-bridging-header.py \
            "$GITHUB_WORKSPACE/bridge/Sapbridge.objc.h" \
            app/DLiPARebuild/DLiPA-Bridging-Header.h

          if [ ! -f app/build/ios/include/unicorn/unicorn.h ]; then
            echo "::error::app/build/ios/include/unicorn/unicorn.h missing after unpacking the bridge"
            exit 1
          fi
          ls -la app/build/ios/
          ls app/build/ios/include

          # The X64I container travels with the archives: it is built in the
          # go-bridge job, which already has Go and the pinned OS X 10.9
          # assets, so the app job does not spend a minute downloading them.
          mv bridge/commerce.x64i app/DLiPARebuild/Resources/commerce.x64i
          ls -la app/DLiPARebuild/Resources/commerce.x64i

      - name: Download the macOS 27 SAP binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # VendorAssets/ is gitignored, so CI has to get the four binaries from
          # the Fetch SAP assets workflow rather than from the checkout.
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow="Fetch SAP assets" \
            --status success --limit 1 --json databaseId --jq ".[0].databaseId")
          if [ -z "$RUN_ID" ]; then
            echo "::error::no successful Fetch SAP assets run; run that workflow first"
            exit 1
          fi
          echo "==> taking assets from Fetch SAP assets run $RUN_ID"
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name sap-assets-macos27 \
            --dir "${{ github.workspace }}/vendor-download"
          mkdir -p "${{ github.workspace }}/VendorAssets"
          cp "${{ github.workspace }}/vendor-download/VendorAssets/"* "${{ github.workspace }}/VendorAssets/"
          ls -la "${{ github.workspace }}/VendorAssets"

      - name: Stage the macOS 27 binaries into the app bundle
        run: |
          # Route B needs these four next to the app. They are the macOS 27 set,
          # not the 10.9 set the go-bridge job uses for the guest image, so
          # their digests differ from anything already in the build.
          sh scripts/stage-assets.sh "$GITHUB_WORKSPACE/VendorAssets" \
            "$GITHUB_WORKSPACE/app/DLiPARebuild/Resources/SapAssets"
          ls -la app/DLiPARebuild/Resources/SapAssets

      - name: Install build tools
        run: |
          # xcodegen turns project.yml into a real .xcodeproj, so there is no
          # hand-edited pbxproj to go stale.
          #
          # libplist and pkg-config are for the seal step: it builds the
          # procursus ldid from source (homebrew's 2.1.5 dropped -S), and that
          # build needs plist/plist.h plus the pkg-config file. Brew's ldid is
          # not installed -- the binary is never called.
          brew install xcodegen libplist pkg-config
          xcodegen --version

      - name: Build the app (unsigned)
        working-directory: app
        run: |
          # Generate the project from project.yml; there is no checked-in
          # pbxproj to go stale.
          xcodegen generate
          ls -la DLiPARebuild.xcodeproj

          # No -sdk iphoneos: the macos-15 image ships the iOS 18 SDK without
          # the installed platform, and naming the SDK makes the asset and
          # storyboard steps probe for runtimes that are not present.
          #
          # No xcpretty either: it is not installed, and "|| true" would mask
          # a real build failure as success.
          # Adhoc-sign rather than skipping signing. CODE_SIGNING_ALLOWED=NO
          # leaves the binary with no LC_CODE_SIGNATURE load command at all,
          # and MobileInstallation then types the bundle as System and rejects
          # registration with error 181. The "-" identity produces an adhoc
          # signature, which is what TrollStore and AltStore expect, and needs
          # no developer account.
          set -o pipefail
          xcodebuild \
            -project DLiPARebuild.xcodeproj \
            -scheme DLiPARebuild \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Locate the built app
        id: app
        run: |
          APP=$(find app/build -name "DLiPARebuild.app" -maxdepth 4 -type d | head -n 1)
          if [ -z "$APP" ]; then echo "::error::DLiPARebuild.app not found"; exit 1; fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          du -sh "$APP"

      - name: Copy the SAP guest image into bundle
        run: |
          APP=$(find app/build -name "DLiPARebuild.app" -maxdepth 4 -type d | head -n 1)
          # A data container, not a Mach-O, so MobileInstallation has nothing
          # to type as a nested executable.
          cp app/DLiPARebuild/Resources/commerce.x64i "$APP/commerce.x64i"
          ls -la "$APP/commerce.x64i"
          # The app looks for commerce_native.bin first, then commerce.x64i;
          # keep only the container so a stale binary cannot be picked up.
          rm -f "$APP/commerce_native.bin"

      - name: Write BuildID
        run: |
          # Embed a build identifier in the bundle so the device log can
          # unambiguously report which CI build is running. Without this,
          # a stale IPA installed via TrollStore looks identical to a fresh
          # one in the log — same bundle id, same app name — and the only
          # way to tell them apart is the SHA of the SapAssets bytes, which
          # is exactly the diagnostic we are trying to localise.
          #
          # The file is read by AppLog on startup and printed verbatim, so
          # any field added here shows up in the device log without code
          # changes.
          APP=$(find app/build -name "DLiPARebuild.app" -maxdepth 4 -type d | head -n 1)
          if [ -z "$APP" ]; then echo "::error::DLiPARebuild.app not found"; exit 1; fi

          # Pin the expected SapAssets digests in the BuildID file too, so
          # the device log shows what the bytes *should* be alongside what
          # they *are*. This makes a stale-bundle diagnosis a one-liner.
          cat > "$APP/BuildID.txt" <<EOF
          build_commit=${{ github.sha }}
          build_run=${{ github.run_id }}
          build_run_attempt=${{ github.run_attempt }}
          build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          build_ref=${{ github.ref_name }}
          ipa_expected_applemediaservices_sha256=95f4558aa2c0ccd9f96ed479e336b630b46bf4b4e0baabc1c1ac8c7d55e21ab4
          ipa_expected_applemediaservices_size=14813888
          ipa_expected_commerce_sha256=76de40a4a32f691947cb926ce3b128d2fc446f7cac9755f831c406cf5a316ac9
          ipa_expected_commerce_size=8092640
          ipa_expected_corefp_sha256=2c30fa2b5f695fd66c0360dce72f54757d03ddb7107549715c12cb359a003b46
          ipa_expected_corefp_size=94842464
          ipa_expected_corefp_icxs_sha256=cb8f55330ec567da3e692dab5f5388bed0312dd9093340477c5759078cc2aa7b
          ipa_expected_corefp_icxs_size=7365344
          EOF
          echo "==> BuildID.txt"
          cat "$APP/BuildID.txt"

      - name: Seal the bundle
        run: |
          # TrollStore error 181 with ApplicationType = System means
          # MobileInstallation found the bundle unsealed. The original DLiPA 1.4,
          # which installs on this device, carries two things an unsigned Xcode
          # build does not:
          #
          #   1. _CodeSignature/CodeResources, a plist listing every resource
          #      with its SHA-1 and SHA-256
          #   2. an LC_CODE_SIGNATURE load command in the Mach-O executable
          #
          # codesign cannot produce them here: it validates the whole bundle and
          # rejects resource after resource. Homebrew ldid no longer supports -S.
          # The procursus build of ldid kept -S; upstream 2.1.5 dropped it.
          APP=$(find app/build -name "DLiPARebuild.app" -maxdepth 4 -type d | head -n 1)
          if [ -z "$APP" ]; then echo "::error::DLiPARebuild.app not found"; exit 1; fi

          python3 scripts/make-coderesources.py "$APP"
          echo "==> CodeResources"
          ls -la "$APP/_CodeSignature"

          # The version matters. Homebrew ldid 2.1.5 asserts flag_S because the
          # upstream release dropped it. The procursus build kept -S.
          git clone --depth 1 --branch v2.1.5-procursus5 \
            https://github.com/opa334/ldid.git /tmp/ldid-src
          # OpenSSL 3 returns const-qualified names from X509_get_subject_name,
          # X509_NAME_get_entry and X509_NAME_ENTRY_get_data; this ldid was
          # written against 1.1 and assigns them to non-const locals. The runner's
          # OpenSSL moved under us and the build stopped with five errors in
          # ldid.cpp, none of them about anything ldid does. Three casts restore
          # what 1.1 returned; nothing else changes.
          sed -i '' \
            -e 's/X509_NAME \*nm = X509_get_subject_name(x);/X509_NAME *nm = const_cast<X509_NAME *>(X509_get_subject_name(x));/' \
            -e 's/e = X509_NAME_get_entry(nm, lastpos);/e = const_cast<X509_NAME_ENTRY *>(X509_NAME_get_entry(nm, lastpos));/' \
            -e 's/ASN1_STRING \*s = X509_NAME_ENTRY_get_data(e);/ASN1_STRING *s = const_cast<ASN1_STRING *>(X509_NAME_ENTRY_get_data(e));/' \
            /tmp/ldid-src/ldid.cpp
          make -C /tmp/ldid-src -j"$(sysctl -n hw.ncpu)"
          # plutil -insert validates entitlement values and rejects team
          # identifiers it does not recognise, so the plist is written whole.
          #
          # The identifier has to name the application: signing with only
          # get-task-allow leaves the signature without an
          # application-identifier, so TrollStore reads a single entitlement and
          # cannot type the bundle as an application. It stays System and
          # registration fails with 181.
          #
          # No certificate is needed. The team value is arbitrary for a locally
          # signed binary; TrollStore rewrites it on install.
          cat > ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
                <key>application-identifier</key>
                <string>A23BC00001.com.a23bc.dliparebuild</string>
                <key>com.apple.developer.team-identifier</key>
                <string>A23BC00001</string>
                <key>get-task-allow</key>
                <true/>
                <key>com.apple.security.cs.allow-jit</key>
                <true/>
                <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
                <true/>
                <key>com.apple.security.cs.allow-dyld-environment-variables</key>
                <true/>
                <key>com.apple.security.cs.disable-library-validation</key>
                <true/>
                <key>com.apple.private.cs.debugger</key>
                <true/>
                <key>com.apple.developer.kernel.increased-memory-limit</key>
                <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint ent.plist
          # -I sets the CodeDirectory identifier. Without it ldid uses the
          # executable basename, which leaves the binary identified as "DLiPA"
          # instead of the bundle id, and MobileInstallation then types the
          # bundle as System. The original DLiPA carries the full bundle id here.
          # No space after -I: ldid takes the value from argv+2, so -I<value>.
          # With a space it reads an empty identifier and then treats the
          # bundle id as a file path.
          /tmp/ldid-src/ldid -Sent.plist "-Icom.a23bc.dliparebuild" "$APP/DLiPARebuild"
          rm -f ent.plist
          echo "==> executable sealed"

      - name: Check the bundle for stray files
        run: |
          # CoreFP.icxs was ending up at the bundle root as well as inside
          # Resources/SapAssets. The root copy is a leftover from an early
          # attempt to satisfy a guest-internal relative path, and it is
          # unnecessary: the Go loader reads the assets from the directory
          # BundleDir names, which the app sets to Resources/SapAssets. A
          # 7 MB unrecognised file at the bundle root is exactly the kind of
          # thing MobileInstallation rejects.
          APP=$(find app/build -name "DLiPARebuild.app" -maxdepth 4 -type d | head -n 1)
          echo "==> bundle root before cleanup"
          ls -la "$APP"
          # The executable name has to come from the bundle, not from a
          # hard-coded string. The allowlist here said "DLiPA" while the
          # product is "DLiPARebuild", so this step deleted the app binary
          # itself and the IPA packaged a bundle with no executable.
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "==> executable: $EXE"
          find "$APP" -maxdepth 1 -type f ! -name "Info.plist" ! -name "PkgInfo" \
            ! -name "$EXE" ! -name "Assets.car" ! -name "*.png" \
            ! -name "BuildID.txt" ! -name "commerce_native.bin" ! -name "commerce.x64i" \
            -print -delete
          if [ ! -f "$APP/$EXE" ]; then
            echo "::error::cleanup removed the executable $EXE"
            ls -la "$APP"
            exit 1
          fi
          echo "==> bundle root after cleanup"
          ls -la "$APP"

      - name: Package as IPA
        id: ipa
        run: |
          # Name the file with a short digest of the binary. A stale copy
          # downloaded earlier is then impossible to confuse with this build.
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "${{ steps.app.outputs.path }}/Info.plist")
          if [ ! -x "${{ steps.app.outputs.path }}/$EXE" ]; then
            echo "::error::no executable named $EXE inside the bundle"
            ls -la "${{ steps.app.outputs.path }}"
            find "${{ steps.app.outputs.path }}" -maxdepth 1 -type f
            exit 1
          fi
          SHA=$(shasum -a 256 "${{ steps.app.outputs.path }}/$EXE" | cut -c1-8)
          NAME="DLiPARebuild-${SHA}.ipa"
          sh scripts/package-ipa.sh "${{ steps.app.outputs.path }}" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Report IPA contents
        run: |
          unzip -l "${{ steps.ipa.outputs.name }}" | tail -n +2 | head -n 30
          echo "--- size ---"
          du -h "${{ steps.ipa.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: DLiPA-ipa
          path: ${{ steps.ipa.outputs.name }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach IPA to a release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: app
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DLiPA-ipa
          path: dist

      - name: Checksum
        run: |
          cd dist
          NAME=$(ls dist/DLiPARebuild-*.ipa | head -n 1)
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DLiPARebuild-*.ipa
            dist/DLiPARebuild-*.ipa.sha256
          body: |
            ## DLiPA (SAP-adapted build)

            This build adds the App Store request signing that Apple now
            requires. Install it with your own Apple ID:

            * **AltStore** - open the IPA from the My Apps tab
            * **Sideloadly** - drag the IPA in and sign in

            Free Apple IDs get a 7-day certificate; re-sign weekly.
            A paid developer account lasts a year.
