name: DLiPARebuild
options:
  bundleIdPrefix: com.a23bc
  # Localizations carried over from the original DLiPA 1.4.
  knownRegions: ['ar', 'de', 'en', 'es', 'fr', 'hi', 'id', 'it', 'ja', 'ko', 'ru', 'tr', 'vi', 'zh-Hans']
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  DLiPARebuild:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    supportedDestinations: [iOS]
    sources:
      - path: DLiPARebuild
        excludes:
          # ibtool on the macos-15 image demands an installed iOS platform,
          # which is not present. The launch screen comes from Info.plist.
          - "**/*.md"
          - "LaunchScreen.storyboard"
          # actool wants a simulator runtime the runner does not have.
          - "Assets.xcassets"
          # The four Apple binaries are no longer a bundle resource: the app
          # resolves them from Apple on first use (see AssetStaging.swift and
          # sapbridge/assets.go), so nothing in CI stages them any more. The
          # exclude stays, so that a checkout which still holds an old,
          # hand-staged Resources/SapAssets cannot quietly put 119 MB back
          # into the IPA.
          - "Resources/SapAssets"
          # The C SAP engine is retired. It ran an OS X 10.9 x86-64 guest and
          # opened uc_open(UC_ARCH_X86), and it includes <unicorn/x86.h>. The
          # aarch64 Unicorn archive does not generate that header, so leaving
          # these in the build fails to compile. Signing now goes through the Go
          # bridge's arm64 machine.
          - "Sap/sap_guest.c"
          - "Sap/sap_objc.c"
    # No dependencies. The gomobile archive is force-loaded into the app
    # binary by OTHER_LDFLAGS below, so the symbols resolve at link time and
    # the bundle stays a single executable. Embedding an xcframework gave
    # MobileInstallation a nested bundle to validate, which is what made
    # registration fail with TrollStore error 181.
    #
    # (XcodeGen rejects an empty dependencies list, so the key is omitted.)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a23bc.dliparebuild
        PRODUCT_NAME: DLiPARebuild
        # The bundle's version strings come from these, not from literals in
        # Info.plist: AppDelegate treats a change in them as "a new build" and
        # clears the cached kbsync blobs, whose bytes carry the assumptions of
        # the binary that wrote them. With literals every CI build answered
        # 1.4.1/1, so that rule never fired between two builds and an
        # over-install kept testing against the previous build's blobs.
        # build-ios.yml overrides CURRENT_PROJECT_VERSION with the run number;
        # MARKETING_VERSION is the release number and stays a decision.
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: DLiPARebuild/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        # Exposes the SAP guest C API (and the remaining Go KBSync helpers)
        # to Swift. Without this the sap_guest_* and Sapbridge* symbols are
        # unresolvable and the build fails.
        SWIFT_OBJC_BRIDGING_HEADER: DLiPARebuild/DLiPA-Bridging-Header.h
        # Unicorn's public headers, staged next to libunicorn.a by
        # scripts/build-unicorn-ios.sh. DLiPARebuild/Sap/sap_guest.c includes
        # <unicorn/unicorn.h> and <unicorn/x86.h>, so the search path is the
        # directory that contains unicorn/, not unicorn/ itself.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/build/ios/include"
        # Headers the framework installs; keep them so the import resolves.
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_BITCODE: NO
        # Adhoc signing. The binary must carry an LC_CODE_SIGNATURE load
        # command or MobileInstallation types it as System and TrollStore
        # fails with error 181, so signing is allowed but with the "-"
        # adhoc identity. No team and no provisioning profile are needed;
        # the user re-signs with their own Apple ID on install.
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Unicorn is force-loaded into SapBridge at build time, but the app
        # link re-links the framework objects, so it needs the archive too.
        # scripts/build-unicorn-ios.sh leaves it at $(SRCROOT)/build/ios/.
        # Both archives are force-loaded into the app binary: SapBridge.a
        # carries the gomobile-generated Sapbridge* symbols, libunicorn.a the
        # emulator they depend on. Force-loading is what makes the bundle a
        # single executable, with no Frameworks/ directory for
        # MobileInstallation to reject at registration.
        OTHER_LDFLAGS:
          - "-Wl,-force_load,$(SRCROOT)/build/ios/SapBridge.a"
          - "-Wl,-force_load,$(SRCROOT)/build/ios/libunicorn.a"
          - "-Wl,-export_dynamic"        # Local networking + arbitrary loads for the embedded HTTP server
        # that serves the itms-services install manifest.
        NSAppTransportSecurity: ""
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
