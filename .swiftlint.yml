# Baseline for the Lint workflow (.github/workflows/lint.yml), which runs
# SwiftLint 0.65.1 on Linux.
#
# Every rule disabled or loosened below was already being violated by code
# that builds and ships today; the counts in the comments come from the
# first run of that workflow (run 42149710634). The intent is a floor, not
# a style war: the rest of the rule set applies to new code, and an
# error-level violation turns the job red.

disabled_rules:
  - trailing_comma                          # 26
  - vertical_parameter_alignment            # 17
  - redundant_string_enum_value             # 6
  - vertical_whitespace                     # 5
  - for_where                               # 4
  - legacy_swiftui_aspect_ratio             # 3
  - implicit_optional_initialization        # 1
  - multiple_closures_with_trailing_closure # 1
  - trailing_whitespace                     # 1
  - trailing_semicolon                      # 1

line_length:
  # Six lines are over the default 120, the longest at 159, and all of them
  # carry a comment or a URL that reads worse wrapped.
  warning: 160
  error: 300
  ignores_urls: true
  ignores_comments: true

function_body_length:
  # The two offenders span 58 and 84 lines: the diagnostics screen and the
  # store-profile handshake. Both are straight-line sequences of steps,
  # which splitting would not improve.
  warning: 100
  error: 300

function_parameter_count:
  # Eleven functions take 6 or 7 parameters, mostly the asset staging and
  # bridge plumbing.
  warning: 8
  error: 12

large_tuple:
  warning: 4
  error: 8

file_length:
  # AppStoreClient.swift is 2,155 lines and there is no honest way to say
  # that in a rule added after the fact. Raised rather than excluded: the
  # file stays checked by every other rule, including for new code, and a
  # fourth 2,000-line file anywhere else still gets a warning.
  warning: 1200
  error: 2500

type_body_length:
  # The same two files: AppStoreClient's class spans 1,293 lines and
  # AppSession's 457.
  warning: 500
  error: 1400

identifier_name:
  # r, s and d are single-character locals in StoreBag.swift, where "if let
  # s = string(...)" is the house shape for a four-way lookup. The other
  # three offenders were renamed instead of listed here -- a and b in
  # AppSession.swift's sort comparator, and errno_str in JITEnabler.swift
  # -- because a permanent blind spot for two of the most common variable
  # names in any new code is a bad trade for three lines of edits.
  excluded: [r, s, d, id]
